plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.1'
	id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.puju'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Boot Web
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// Spring Boot Data JPA
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// Spring Boot Validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Spring Security
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'

	// H2 Database (개발/프로토타입용 - 현재 비활성화)
	// runtimeOnly 'com.h2database:h2'

	// PostgreSQL Driver
	runtimeOnly 'org.postgresql:postgresql'

	// Flyway (Database Migration)
	implementation 'org.flywaydb:flyway-core'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Spring Boot DevTools
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// Spring Boot Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

// 프론트엔드 빌드 결과물 검증 태스크
tasks.register('validateFrontendBuild') {
	doFirst {
		def frontendDistDir = file("${project.rootDir}/../frontend/dist")
		def indexHtml = file("${frontendDistDir}/index.html")
		def assetsDir = file("${frontendDistDir}/assets")

		if (!frontendDistDir.exists() || !indexHtml.exists()) {
			throw new GradleException(
				"""
				❌ 프론트엔드 빌드 결과물이 없습니다!

				먼저 프론트엔드를 빌드해주세요:
				  cd ../frontend
				  npm install
				  npm run build

				빌드 결과물 위치: ${frontendDistDir.absolutePath}
				""".stripIndent()
			)
		}

		// assets 폴더 체크
		if (!assetsDir.exists() || assetsDir.listFiles().length == 0) {
			throw new GradleException("❌ 프론트엔드 assets 폴더가 비어있습니다!")
		}

		// index.html 크기 체크 (비어있지 않은지)
		if (indexHtml.length() < 100) {
			throw new GradleException("❌ index.html이 비정상적으로 작습니다!")
		}

		println("✅ 프론트엔드 빌드 검증 완료")
		println("   - index.html: ${indexHtml.length()} bytes")
		println("   - assets 파일 개수: ${assetsDir.listFiles().length}개")
	}
}

// 프론트엔드 빌드 결과물을 static 폴더로 복사
tasks.register('copyFrontend', Copy) {
	from "${project.rootDir}/../frontend/dist"
	into "${project.buildDir}/resources/main/static"

	dependsOn 'validateFrontendBuild'
}

// processResources가 copyFrontend에 의존
tasks.named('processResources') {
	dependsOn 'copyFrontend'
}

// bootJar도 명시적으로 의존성 추가
tasks.named('bootJar') {
	dependsOn 'copyFrontend'
}

tasks.named('test') {
	useJUnitPlatform()
}
